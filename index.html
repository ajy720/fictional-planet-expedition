<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05080e">
  <meta name="description" data-copy-content="common.description">
  <link rel="icon" href="data:,">
  <title data-copy="common.appTitle"></title>
</head>
<body>
  <div id="scene" class="scene"></div>
  <canvas id="arrival-layer" class="arrival-layer" aria-hidden="true" hidden></canvas>
  <div id="view-fade" aria-hidden="true"></div>
  <div id="scroll-track" aria-hidden="true"></div>
  <header class="topbar">
    <a class="wordmark" href="./" data-copy-aria-label="common.homeLink">
      <span class="orbit-mark" aria-hidden="true"></span><span data-copy="common.appTitle"></span>
    </a>
    <ol id="route-nodes" class="route-nodes" data-copy-aria-label="flight.nodes" hidden></ol>
    <div class="utilities">
      <button type="button" id="sound" class="utility" hidden><span class="sound-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="sound-label"></span></button>
      <button type="button" id="sources" class="utility"><span data-copy="source.title"></span> <span aria-hidden="true">↗</span></button>
    </div>
  </header>
  <main>
    <section id="welcome" class="welcome" aria-labelledby="title">
      <div class="welcome-content" data-hud="upper-left">
        <h1 id="title" tabindex="-1" data-copy="welcome.title"></h1>
        <p class="welcome-copy" data-copy="welcome.description"></p>
        <div id="start-actions" class="start-actions">
          <button type="button" id="start-sound" class="button primary"><span data-copy="welcome.startSound"></span> <span aria-hidden="true">↗</span></button>
          <button type="button" id="start-muted" class="button"><span data-copy="welcome.startMuted"></span> <span aria-hidden="true">↗</span></button>
        </div>
        <div id="resume-actions" class="start-actions" hidden>
          <button type="button" id="resume" class="button primary"><span data-copy="welcome.resume"></span> <span aria-hidden="true">↗</span></button>
          <button type="button" id="new-journey" class="button" data-copy="welcome.newJourney"></button>
        </div>
        <p id="welcome-status" role="status" class="small" hidden></p>
      </div>
      <p class="welcome-footer" data-hud="lower-left" data-copy="welcome.footer"></p>
    </section>

    <section id="journey" class="journey" aria-labelledby="stage-title" hidden>
      <div id="optics-frame" class="optics-frame" aria-hidden="true" hidden>
        <span id="optics-mode" data-hud="upper-right"></span>
        <span class="optics-star" data-copy="world.adrian.referenceName"></span>
      </div>
      <div id="orbit-labels" class="scene-labels" aria-hidden="true" hidden></div>
      <div id="echo-labels" class="scene-labels" aria-hidden="true" hidden></div>
      <div id="flight-target" class="flight-target" aria-hidden="true" hidden><i></i><span id="flight-target-name"></span></div>
      <div class="telemetry" data-hud="upper-left">
        <p id="stage-context" class="eyebrow"></p>
        <h2 id="stage-title" tabindex="-1"></h2>
        <p id="stage-description"></p>
      </div>
      <div class="scene-hud">
        <div class="readout" data-hud="lower-left">
          <span id="metric-label" class="eyebrow"></span>
          <strong id="metric"></strong>
          <span id="metric-note" class="small"></span>
          <span id="metric-distance-analogy" class="small" hidden></span>
        </div>
        <div class="scene-actions">
          <p id="instruction" class="small"></p>
          <div id="intro-actions" class="buttons" hidden>
            <button type="button" id="prev-section" class="button" data-copy="intro.previous"></button>
            <button type="button" id="next-section" class="button" data-copy="intro.next"></button>
            <button type="button" id="launch" class="button primary"><span data-copy="intro.launch"></span> <span aria-hidden="true">↗</span></button>
          </div>
          <div id="flight-actions" class="buttons" hidden>
            <button type="button" id="pause-flight" class="button" data-copy="common.pause"></button>
            <button type="button" id="step-flight" class="button primary" hidden data-copy="flight.nextStep"></button>
          </div>
          <div id="optics-actions" class="buttons" role="group" data-copy-aria-label="flight.opticsControls" hidden>
            <button type="button" id="optics-visible" class="button" aria-pressed="true" data-copy="flight.visibleLight"></button>
            <button type="button" id="optics-infrared" class="button" aria-pressed="false" data-copy="flight.infrared"></button>
          </div>
          <div id="petrova-callout" class="spatial-callout" hidden>
            <button type="button" id="track-petrova" class="button primary" data-copy="flight.trackPetrova"></button>
          </div>
          <div id="departure-actions" class="buttons" hidden>
            <button type="button" id="departure-prev" class="button" hidden data-copy="flight.previousView"></button>
            <button type="button" id="departure-next" class="button primary" data-copy="flight.nextView"></button>
            <button type="button" id="cancel-departure" class="button" data-copy="common.cancel"></button>
          </div>
          <div id="surface-actions" class="surface-controls" hidden></div>
          <button type="button" id="surface-record" class="button primary" data-action="record" hidden><span data-copy="common.viewRecord"></span> <span aria-hidden="true">↗</span></button>
          <div id="orbit-actions" class="buttons" hidden>
            <div class="orbit-controls" role="group" data-copy-aria-label="b612.cameraControls">
              <button type="button" class="button icon" data-orbit="left" data-copy-aria-label="b612.rotateLeft">←</button>
              <button type="button" class="button icon" data-orbit="right" data-copy-aria-label="b612.rotateRight">→</button>
              <button type="button" class="button icon" data-orbit="up" data-copy-aria-label="b612.rotateUp">↑</button>
              <button type="button" class="button icon" data-orbit="down" data-copy-aria-label="b612.rotateDown">↓</button>
              <button type="button" class="button icon" data-orbit="in" data-copy-aria-label="b612.zoomIn">+</button>
              <button type="button" class="button icon" data-orbit="out" data-copy-aria-label="b612.zoomOut">−</button>
            </div>
          </div>
          <div id="rose-actions" class="buttons" hidden>
            <button type="button" id="keep-looking" class="button" data-copy="b612.backToOrbit"></button>
          </div>
          <div id="sprout-callout" class="spatial-callout" hidden>
            <button type="button" id="pull-sprout" class="button primary" data-copy="b612.removeSprout"></button>
          </div>
          <div id="rose-callout" class="spatial-callout" hidden>
            <button type="button" id="observe" class="button primary" hidden><span data-copy="b612.observeRose"></span> <span aria-hidden="true">↗</span></button>
            <button type="button" id="cover" class="button primary" hidden><span data-copy="b612.placeCover"></span> <span aria-hidden="true">↗</span></button>
            <button type="button" id="record" class="button primary" hidden><span data-copy="common.viewRecord"></span> <span aria-hidden="true">↗</span></button>
          </div>
        </div>
        <div class="scene-utilities" data-hud="lower-right">
          <button type="button" id="transmit" class="button" hidden data-copy="communication.send"></button>
          <button type="button" id="look-back" class="button" hidden><span data-copy="earthView.heading"></span> <span aria-hidden="true">↶</span></button>
          <button type="button" id="abort" class="utility" hidden data-copy="common.abort"></button>
        </div>
      </div>
    </section>

    <section id="log" class="log-screen" aria-labelledby="log-title" hidden>
      <article class="log-panel" data-hud="reading">
        <p class="eyebrow"><span class="eyebrow-dot"></span> <span data-copy="record.heading"></span> <strong id="log-count"></strong></p>
        <h2 id="log-title" tabindex="-1"></h2>
        <p id="log-work" class="log-work"></p>
        <div class="log-entry">
          <span class="eyebrow" data-copy="record.result"></span>
          <p id="log-result"></p>
          <ul id="log-details" class="record-details" hidden></ul>
          <div id="log-paths" hidden></div>
        </div>
        <div id="log-context" hidden></div>
        <div class="log-entry log-comparison">
          <p class="eyebrow" data-copy="record.science"></p>
          <h3 id="log-question"></h3>
          <p id="log-comparison"></p>
          <a id="log-science" class="source-link" target="_blank" rel="noopener noreferrer" hidden></a>
        </div>
        <div class="log-entry">
          <span class="eyebrow" data-copy="record.distance"></span>
          <p id="log-distance"></p>
          <p id="log-distance-analogy" class="small distance-analogy" hidden></p>
        </div>
        <a id="log-source" class="source-link" target="_blank" rel="noopener noreferrer"></a>
        <div class="buttons log-actions">
          <button type="button" id="log-ending" class="button primary" hidden data-copy="record.ending"></button>
          <button type="button" id="log-next" class="button primary" data-copy="map.title"></button>
          <button type="button" id="log-back" class="button" hidden data-copy="record.backToList"></button>
          <button type="button" id="log-stellar" class="button"><span data-copy="record.stellar"></span> <span aria-hidden="true">↗</span></button>
          <button type="button" id="log-earth" class="button"><span data-copy="earthView.heading"></span> <span aria-hidden="true">↶</span></button>
          <button type="button" id="home" class="button" data-copy="common.home"></button>
        </div>
      </article>
      <div class="log-dot" data-hud="lower-right" aria-hidden="true"><i></i> <span data-copy="common.earth"></span></div>
    </section>

    <section id="route-map" class="route-map" aria-labelledby="map-title" hidden>
      <div class="map-heading">
        <div data-hud="upper-left">
          <p id="map-position" class="eyebrow"></p>
          <h2 id="map-title" tabindex="-1" data-copy="map.title"></h2>
        </div>
        <button type="button" id="map-back" class="button" data-hud="upper-right" data-copy="common.close"></button>
      </div>
      <div id="map-markers" class="map-markers" role="group" data-copy-aria-label="map.markers"></div>
      <div class="map-footer">
        <div class="map-tools" data-hud="lower-left">
          <button type="button" id="distance-open" class="button"><span data-copy="distance.openComparison"></span> <span aria-hidden="true">↗</span></button>
          <p class="map-scale small" data-copy="map.scaleNote"></p>
        </div>
        <div id="map-inspection" class="map-inspection spatial-callout" hidden>
          <div class="map-inspection-content">
            <div class="map-world">
              <p id="map-world-state" class="eyebrow"></p>
              <h3 id="map-world-name" tabindex="-1"></h3>
            </div>
            <div class="map-world-details">
              <p id="map-world-work"></p>
              <p id="map-world-distance" class="small"></p>
              <p id="map-distance-analogy" class="small distance-analogy" hidden></p>
              <p id="map-flight-length" class="small" hidden></p>
            </div>
            <div class="buttons">
              <button type="button" id="map-record" class="button" hidden data-copy="map.readRecord"></button>
              <button type="button" id="map-travel" class="button primary" hidden></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="directory" class="directory-screen" aria-labelledby="directory-title" hidden>
      <article class="directory-panel" data-hud="reading">
        <div class="directory-heading">
          <div><p id="directory-count" class="eyebrow"></p><h2 id="directory-title" tabindex="-1" data-copy="archive.title"></h2></div>
          <button type="button" id="directory-back" class="button" data-copy="common.close"></button>
        </div>
        <p id="directory-position" class="small"></p>
        <div id="directory-entries" class="directory-entries"></div>
        <div id="directory-actions" class="buttons">
          <button type="button" id="archive-next" class="button primary" data-copy="map.title"></button>
          <button type="button" id="archive-earth" class="button" data-copy="archive.revisitEnding"></button>
        </div>
      </article>
    </section>

    <section id="ending" class="ending-screen" data-copy-aria-label="ending.label" hidden>
      <div class="ending-caption" data-hud="lower-center">
        <button type="button" id="ending-step" class="button" hidden data-copy="ending.step"></button>
        <div id="ending-question" hidden>
          <p class="eyebrow" data-copy="earthView.heading"></p>
          <h2 id="ending-title" tabindex="-1" data-copy="ending.question"></h2>
          <div class="buttons ending-actions">
            <button type="button" id="ending-records" class="button primary" data-copy="ending.openRecords"></button>
            <button type="button" id="ending-photo" class="button" aria-haspopup="dialog" data-copy="ending.openPhoto"></button>
          </div>
        </div>
      </div>
    </section>

    <p id="status" class="sr-only" aria-live="polite" aria-atomic="true"></p>
    <p id="save-warning" class="save-warning" role="status" hidden data-copy="error.save"></p>
    <section id="error" class="error-card" aria-labelledby="error-title" hidden>
      <h2 id="error-title" data-copy="error.title"></h2>
      <p id="error-copy"></p>
      <button type="button" id="retry" class="button primary" data-copy="error.retry"></button>
      <button type="button" id="error-back" class="button" hidden data-copy="error.returnToLaunch"></button>
    </section>
  </main>

  <dialog id="ending-photo-dialog" class="dialog ending-photo-dialog" aria-labelledby="ending-photo-title">
    <div class="dialog-content ending-photo-content">
      <div class="dialog-title">
        <h2 id="ending-photo-title" data-copy="ending.photoTitle"></h2>
        <button type="button" class="button icon" data-close data-copy-aria-label="common.close" autofocus>×</button>
      </div>
      <figure>
        <img src="./references/pale-blue-dot.jpg" width="1536" height="1519" loading="lazy" alt="" data-copy-alt="ending.photoAlt">
        <figcaption><a href="https://science.nasa.gov/photojournal/pale-blue-dot-revisited/" target="_blank" rel="noopener noreferrer">NASA/JPL-Caltech</a></figcaption>
      </figure>
    </div>
  </dialog>
  <dialog id="source-dialog" class="dialog" aria-labelledby="source-title">
    <div class="dialog-content">
      <div class="dialog-title"><h2 id="source-title" data-copy="source.title"></h2><button type="button" class="button icon" data-close data-copy-aria-label="common.close" autofocus>×</button></div>
      <p data-copy="source.description"></p>
      <p data-copy="source.thanks"></p>
      <ul class="source-list">
        <li data-copy="source.firstTalk"></li>
        <li data-copy="source.secondTalk"></li>
      </ul>
      <p data-copy="source.scaleNote"></p>
      <ul class="source-list">
        <li><a href="https://eyes.nasa.gov/apps/solar-system/#/earth/" target="_blank" rel="noopener noreferrer" data-copy="source.camera"></a></li>
        <li><a href="https://science.nasa.gov/moon/by-the-numbers/" target="_blank" rel="noopener noreferrer" data-copy="source.moonFacts"></a></li>
        <li><a href="https://solarsystem.nasa.gov/solar-system/sun/in-depth.amp" target="_blank" rel="noopener noreferrer" data-copy="source.sunFacts"></a></li>
        <li><a href="https://science.nasa.gov/earth/earth-observatory/the-blue-marble-true-color-global-imagery-at-1km-resolution/" target="_blank" rel="noopener noreferrer" data-copy="source.earthTexture"></a></li>
        <li><a href="https://svs.gsfc.nasa.gov/4720/" target="_blank" rel="noopener noreferrer" data-copy="source.moonTexture"></a></li>
        <li><a href="https://science.nasa.gov/photojournal/pale-blue-dot-revisited/" target="_blank" rel="noopener noreferrer" data-copy="source.paleBlueDot"></a></li>
        <li><a href="https://www.lepetitprince.com/en/new-products-from-our-licensees/cutebee-unveils-two-book-nooks-inspired-by-the-little-prince/" target="_blank" rel="noopener noreferrer" data-copy="source.rose"></a></li>
      </ul>
      <ul id="destination-sources" class="source-list"></ul>
      <p class="small" data-copy="source.landmarkNote"></p>
      <ul class="source-list">
        <li><a href="https://www.data.go.kr/data/15099316/fileData.do" target="_blank" rel="noopener noreferrer" data-copy="source.metro"></a></li>
        <li><a href="https://www.data.go.kr/data/15067652/fileData.do" target="_blank" rel="noopener noreferrer" data-copy="source.railway"></a></li>
      </ul>
      <p class="small" data-copy="source.audio"></p>
    </div>
  </dialog>
  <dialog id="distance-dialog" class="dialog" aria-labelledby="distance-title">
    <div class="dialog-content distance-content">
      <div class="dialog-title"><h2 id="distance-title" data-copy="distance.title"></h2><button type="button" class="button icon" data-close data-copy-aria-label="common.close" autofocus>×</button></div>
      <p data-copy="distance.logScale"></p>
      <p data-copy="distance.analogyHint"></p>
      <div class="distance-ruler" aria-hidden="true"><span data-copy="distance.yearTick"></span><span data-copy="distance.tenTick"></span><span data-copy="distance.hundredTick"></span><span data-copy="distance.thousandTick"></span></div>
      <ul id="distance-comparison" class="distance-comparison"></ul>
      <p id="unscaled-worlds" class="small"></p>
    </div>
  </dialog>
  <dialog id="earth-dialog" class="earth-dialog" aria-labelledby="earth-title">
    <span class="earth-point-label" aria-hidden="true" data-copy="common.earth"></span>
    <div class="earth-caption" data-hud="lower-left">
      <p id="earth-context" class="eyebrow" data-copy="earthView.heading"></p>
      <h2 id="earth-title" data-copy="earthView.title"></h2>
      <p id="earth-note"></p>
      <p id="earth-distance-analogy" class="small distance-analogy" hidden></p>
      <p id="earth-angle" class="small" hidden></p>
      <a id="earth-reference" class="source-link" target="_blank" rel="noopener noreferrer" hidden></a>
      <p id="stellar-distance" class="small" hidden><span data-copy="earthView.stellarDistance"></span><br><a href="https://apod.nasa.gov/rjn/apod/ap190413.html" target="_blank" rel="noopener noreferrer" data-copy="earthView.stellarSource"></a></p>
      <button type="button" id="earth-return" class="button" data-close autofocus data-copy="common.returnToRoute"></button>
    </div>
  </dialog>
  <dialog id="communication-dialog" class="dialog communication-dialog" aria-labelledby="communication-title">
    <div class="dialog-content" data-hud="reading">
      <div class="dialog-title">
        <h2 id="communication-title" data-copy="communication.title"></h2>
        <button type="button" class="button icon" data-close data-copy-aria-label="common.close" autofocus>×</button>
      </div>
      <p data-copy="communication.assumption"></p>
      <p class="eyebrow" data-copy="communication.playback"></p>
      <p class="small" data-copy="communication.playbackScale"></p>
      <div id="signal-visual" class="signal-visual">
        <div class="signal-path" aria-hidden="true">
          <div class="signal-track"><i class="signal-packet"></i></div>
          <div class="signal-endpoint signal-earth"><span data-copy="common.earth"></span></div>
          <div class="signal-endpoint signal-pandora"><span data-copy="world.pandora.name"></span></div>
        </div>
        <div id="signal-status" class="signal-status"></div>
      </div>
      <ol id="signal-stages" class="signal-stages">
        <li><span data-copy="communication.stageSend"></span> <strong data-copy="communication.zeroYears"></strong></li>
        <li><span data-copy="communication.stageArrival"></span> <strong data-copy="communication.arrivalYears"></strong></li>
        <li><span data-copy="communication.stageReply"></span> <strong data-copy="communication.replyYears"></strong></li>
      </ol>
      <progress id="communication-progress" value="0" data-copy-aria-label="communication.progress"></progress>
      <div class="buttons">
        <button type="button" id="communication-return" class="button" data-close data-copy="common.returnToRoute"></button>
        <button type="button" id="replay-communication" class="button" hidden data-copy="communication.replay"></button>
      </div>
    </div>
  </dialog>
  <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title">
    <div class="dialog-content">
      <div class="dialog-title"><h2 id="confirm-title"></h2><button type="button" class="button icon" data-close data-copy-aria-label="common.close" autofocus>×</button></div>
      <p id="confirm-copy"></p>
      <div class="buttons"><button type="button" id="confirm-action" class="button primary"></button><button type="button" class="button" data-close data-copy="common.cancel"></button></div>
    </div>
  </dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
